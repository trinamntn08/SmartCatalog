[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "build",
  "config",
  "dist",
  "input",
  "output",
  "to_integrate",
]

[tool.ruff.lint]
# Begin with high-signal correctness checks. Broaden this list deliberately,
# with focused cleanup and a green checkpoint for each new rule family.
select = ["E9", "F63", "F7", "F82"]
