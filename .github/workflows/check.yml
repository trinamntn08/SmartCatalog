name: checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up and validate
        shell: pwsh
        run: .\tools\setup.ps1 -Mode Agent -PythonVersion "3.13"
      - name: Set up build environment
        shell: pwsh
        run: .\tools\setup.ps1 -Mode Build -PythonVersion "3.13"
      - name: Build application
        shell: pwsh
        run: .\build_exe.ps1
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: SmartCatalog-Windows
          path: |
            dist/SmartCatalog-Windows.zip
            dist/SmartCatalog-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30
