name: checks

on:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up and validate
        shell: pwsh
        run: .\tools\setup.ps1 -Mode Agent -PythonVersion "3.13"
